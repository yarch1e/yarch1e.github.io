<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yarchie — все ссылки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0b22; --ink:#f4f0ff; --muted:#b5acd8; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --b1:#7c3aed; --b2:#2aabee; --b3:#ff4d8d;
  --tg:#2aabee; --tw:#9146ff; --yt:#ff3b3b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f5f1ff;--ink:#1b1536;--muted:#625a8a;--card:rgba(255,255,255,.7);--line:rgba(60,40,140,.16)}
}
:root[data-theme="light"]{--bg:#f5f1ff;--ink:#1b1536;--muted:#625a8a;--card:rgba(255,255,255,.7);--line:rgba(60,40,140,.16)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-weight:500;display:flex;justify-content:center;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:60vmax;height:60vmax;background:var(--b1);top:-20vmax;left:-15vmax}
.bg i:nth-child(2){width:50vmax;height:50vmax;background:var(--b2);bottom:-18vmax;right:-14vmax;animation-delay:-6s}
.bg i:nth-child(3){width:34vmax;height:34vmax;background:var(--b3);top:45%;left:55%;opacity:.35;animation-delay:-11s}
@keyframes float{to{transform:translate(6vmax,5vmax) scale(1.12)}}
main{position:relative;z-index:1;width:100%;max-width:520px;padding:56px 20px 40px;text-align:center}
.avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 22px;border:3px solid var(--ink);box-shadow:0 0 0 7px var(--line),0 18px 50px rgba(0,0,0,.35)}
h1{font-family:Unbounded,Manrope,sans-serif;font-weight:800;font-size:clamp(40px,13vw,64px);line-height:1;margin:0 0 12px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:17px;margin:0 0 34px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
a.link{display:flex;align-items:center;justify-content:center;gap:14px;position:relative;padding:14px 18px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
a.link:hover{transform:translateY(-2px);border-color:var(--c)}
a.link:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.ico{position:absolute;left:14px;width:48px;height:48px;border-radius:14px;background:var(--c);display:grid;place-items:center}
.ico svg{width:26px;height:26px;fill:#fff}
.name{font-family:Unbounded,Manrope,sans-serif;font-weight:600;font-size:16px;padding:14px 0}
a.donate{display:block;margin-top:28px;padding:20px 18px;border-radius:18px;background:linear-gradient(90deg,#f57d07,#ff4d8d);color:#fff;text-decoration:none;font-family:Unbounded,Manrope,sans-serif;font-weight:800;font-size:18px;box-shadow:0 12px 34px rgba(245,125,7,.35);transition:transform .15s}
a.donate:hover{transform:translateY(-2px)}
a.donate:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.av{position:relative;width:132px;height:132px;margin:0 auto 22px}
.av .avatar{margin:0}
.heart{position:absolute;top:-8px;right:-16px;width:65px;height:65px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:34px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .15s}
.heart:hover{transform:scale(1.1)}
.heart:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.fh{position:absolute;top:0;right:0;pointer-events:none;z-index:3;line-height:1;animation:rise 1.3s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-130px) scale(1.2) rotate(var(--rot))}}
.heart:active{transform:scale(.92)}
.heart{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.heart.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.45)}}
.stat{color:var(--muted);font-size:14px;margin:-22px 0 30px}
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
a{-webkit-user-drag:none}
::selection{background:transparent}
.av::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 0deg,var(--b1),var(--b2),var(--b3),var(--b1));filter:blur(11px);opacity:.85;animation:spin 8s linear infinite}
.av .avatar{position:relative;z-index:1}
.heart{z-index:4}
@keyframes spin{to{transform:rotate(360deg)}}
h1{padding-bottom:.12em;background:linear-gradient(90deg,#ffb347,#ff5e8a,#a35bff,#38b6ff);background-size:100% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
@keyframes gshift{from{background-position:0 0}to{background-position:200% 0}}
.bgimg{position:absolute;inset:-10%;z-index:-1;background-size:cover;background-position:center;filter:blur(55px) saturate(1.5);opacity:.5;transform:scale(1.2)}
.bg i{opacity:.3}
a.link,a.donate{overflow:hidden;will-change:transform}
a.donate{position:relative}
a.link{transition:transform .15s,border-color .15s,background-color .25s,color .25s}
a.link:hover{background:var(--c);border-color:var(--c);color:#fff}
a.link:hover .ico{background:rgba(255,255,255,.22)}
.theme{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:5;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.theme:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sound,.langbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.sound{right:70px;width:46px}
.langbtn{left:14px;width:auto;padding:0 15px;display:flex;align-items:center;gap:7px;font:700 14px Manrope,system-ui,sans-serif}
.sound:focus-visible,.langbtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.langmenu{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:6;min-width:170px;padding:6px;border-radius:16px;border:1px solid var(--line);background:var(--bg);box-shadow:0 14px 40px rgba(0,0,0,.4);display:none}
.langmenu.open{display:block}
#langflag{font-size:21px;line-height:1}
.langmenu{max-height:calc(100vh - 110px);overflow-y:auto}
.langmenu button{display:flex;align-items:center}
.langmenu .mf{display:inline-block;width:32px;font-size:19px;line-height:1}
.langmenu .sep{height:1px;margin:6px 10px;background:var(--line)}
.sub.typing::after,.bio.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-.14em;background:currentColor;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bio{color:var(--ink);font-size:18px;font-weight:700;margin:0 0 8px}
@media (min-width:900px){.bio{font-size:23px;margin-bottom:10px}}
h1{background-image:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%),linear-gradient(90deg,#ffb347,#ff5e8a,#a35bff,#38b6ff);background-size:300% 100%,100% 100%;background-repeat:no-repeat;background-position:90% 0,0 0;animation:nickshine 1.6s ease-in-out .5s 1 both}
@keyframes nickshine{from{background-position:90% 0,0 0}to{background-position:10% 0,0 0}}
.langmenu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:500 15px Manrope,system-ui,sans-serif;cursor:pointer}
.langmenu button:hover,.langmenu button[aria-current="true"]{background:var(--card)}
.st{position:absolute;left:50%;top:50%;pointer-events:none;z-index:3;line-height:1;animation:burst 1s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1.3) rotate(var(--r))}}
.heart,.theme,.sound,.langbtn{transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .25s,border-color .25s,box-shadow .25s}
.theme:hover,.sound:hover,.langbtn:hover{transform:scale(1.08);border-color:var(--muted)}
.theme:active,.sound:active,.langbtn:active{transform:scale(.93)}
a.link,a.donate{transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background-color .3s,color .3s,box-shadow .3s}
a.link:active,a.donate:active{filter:brightness(.95)}
a.donate:hover{box-shadow:0 16px 42px rgba(245,125,7,.5)}
.langmenu{display:block;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transform-origin:top left;transition:opacity .22s ease,transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s linear .22s}
.langmenu.open{opacity:1;visibility:visible;transform:none;transition:opacity .22s ease,transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s}
.langmenu button{transition:background-color .2s,transform .2s}
.langmenu button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.av::before,h1,a.link::after,a.donate::after{animation:none}.st{display:none}}
@media (prefers-reduced-motion:reduce){.heart,.theme,.sound,.langbtn,.langmenu,.langmenu button,a.link,a.donate{transition:none}}
@media (min-width:900px){
body{align-items:center}
.theme{top:calc(env(safe-area-inset-top,0px) + 22px);right:22px}
.sound,.langbtn{top:calc(env(safe-area-inset-top,0px) + 22px)}
.sound{right:82px}
.langbtn{left:22px}
.langmenu{left:22px;top:calc(env(safe-area-inset-top,0px) + 76px)}
main{max-width:660px;padding:48px 24px}
.av{width:184px;height:184px;margin-bottom:28px}
.av .avatar{width:100%;height:100%;border-width:4px;box-shadow:0 0 0 10px var(--line),0 24px 70px rgba(0,0,0,.4)}
.heart{top:-6px;right:-22px;width:80px;height:80px;font-size:42px}
h1{font-size:88px;margin-bottom:16px}
.sub{font-size:21px;margin-bottom:44px}
.stat{font-size:16px;margin:-30px 0 38px}
ul{gap:16px}
a.link{padding:18px 24px;border-radius:22px}
.ico{left:18px;width:58px;height:58px;border-radius:16px}
.ico svg{width:30px;height:30px}
.name{font-size:19px;padding:17px 0}
a.donate{margin-top:36px;padding:26px 24px;font-size:21px;border-radius:22px}
.bg i{filter:blur(100px)}
}
@media (prefers-reduced-motion:reduce){.heart,.heart.pop{transition:none;animation:none}.fh{display:none}}
@media (prefers-reduced-motion:reduce){a.link,a.donate{transition:none}.bg i{animation:none}}
</style>
</head>

    paintSound();if(soundOn)tone(660,.15,.08);
  });
  var taps=[];
  function stars(){
    buzz([20,40,20,40,30]);
    if(soundOn){tone(880,.2,.03);setTimeout(function(){tone(1175,.25,.025)},110)}
    if(calm)return;
    var S=['⭐','🌟','✨'];
    for(var i=0;i<22;i++){
      var s=document.createElement('span');s.className='st';s.textContent=S[i%3];
      var a=Math.PI*2*i/22+Math.random()*.3,r=90+Math.random()*60;
      s.style.setProperty('--tx',Math.cos(a)*r+'px');s.style.setProperty('--ty',Math.sin(a)*r+'px');
      s.style.setProperty('--r',(Math.random()*360-180)+'deg');s.style.fontSize=(16+Math.random()*14)+'px';
      s.addEventListener('animationend',function(){this.remove()});av.appendChild(s);
    }
  }
  av.addEventListener('pointerdown',function(e){
    if(e.target.closest&&e.target.closest('#heart'))return;
    var n=Date.now();taps=taps.filter(function(x){return n-x<2000});taps.push(n);
    if(taps.length>=5){taps=[];stars()}
  });
  var lb=document.getElementById('langbtn'),menu=document.getElementById('langmenu');
  function closeMenu(){menu.classList.remove('open');lb.setAttribute('aria-expanded','false')}
  function retype(el,txt){
    clearTimeout(el._t);
    var cur=el.textContent.replace(/\u200b/g,'');
    if(calm||cur===txt){el.textContent=txt;el.classList.remove('typing');return}
    el.classList.add('typing');
    var i=cur.length;
    (function er(){
      if(i>0){i--;el.textContent=cur.slice(0,i)||'\u200b';el._t=setTimeout(er,6)}
      else{var j=0;(function ty(){j++;el.textContent=txt.slice(0,j);if(j<txt.length)el._t=setTimeout(ty,15);else el._t=setTimeout(function(){el.classList.remove('typing')},600)})()}
    })();
  }
  function applyLang(anim){
    var t=T();document.documentElement.lang=lang;document.title=t.ttl;
    document.querySelectorAll('[data-i]').forEach(function(el){var v=t[el.getAttribute('data-i')];if(anim)retype(el,v);else el.textContent=v});
    btn.setAttribute('aria-label',t.heart);btn.title=t.heart;
    document.getElementById('langcode').textContent=t.c;document.getElementById('langflag').textContent=F[lang];lb.setAttribute('aria-label',t.lang);
    menu.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-current',b.dataset.k===lang?'true':'false')});
    paint();paintSound();
  }
  [['ru','en','es','hy','el','be','de','fr','it','pt']].forEach(function(g,gi){
    if(gi){var d=document.createElement('div');d.className='sep';d.setAttribute('role','separator');menu.appendChild(d)}
    g.forEach(function(k){
    var b=document.createElement('button');b.type='button';b.setAttribute('role','menuitem');b.dataset.k=k;var fl=document.createElement('span');fl.className='mf';fl.textContent=F[k];b.appendChild(fl);b.appendChild(document.createTextNode(D[k].n));
    b.addEventListener('click',function(){lang=k;try{localStorage.setItem('yarchie-lang',k)}catch(e){}closeMenu();applyLang(true)});
    menu.appendChild(b);
    });
  });
  lb.addEventListener('click',function(e){e.stopPropagation();var o=!menu.classList.contains('open');menu.classList.toggle('open',o);lb.setAttribute('aria-expanded',String(o))});
  document.addEventListener('click',closeMenu);
  applyLang();
  ['selectstart','dragstart','contextmenu','copy','cut'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})});
})();
</script>
